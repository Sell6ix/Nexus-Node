[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-node"
version = "0.3.0"
description = "Multi-user personal assistant hub for phone and PC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "psutil>=5.9.8",
  "python-dotenv>=1.0.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.0,<5",
  "PyJWT>=2.8.0",
  "websockets>=12.0",
  "pywebpush>=2.0.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nexus-node = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
